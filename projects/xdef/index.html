<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XDEFENSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=JetBrains+Mono:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script type="module" src="./main.jsx"></script>
<style>
:root {
  --bg-void: #0a0d11;
  --bg-map: #051e2c;
  --bg-panel: #10151c;
  --bg-raised: #18202a;
  --bg-inset: #0c1117;
  --border: #243040;
  --border-bright: #747474;
  --border-accent: #5a4a1a;
  --text-dim: #5a6778;
  --text: #b8c5d8;
  --text-bright: #e8f0fa;
  --text-region: #6d7480;
  --amber: #f5a524;
  --amber-dim: #a8751a;
  --amber-glow: rgba(245, 165, 36, 0.25);
  --green: #4ade80;
  --cyan: #22d3ee;
  --cyan-glow: rgba(34, 211, 238, 0.4);
  --yellow: #fbbf24;
  --orange: #fb923c;
  --red: #ef4444;
  --red-dim: #7a2424;
  --magenta: #e879f9;
  --scanline: rgba(245, 165, 36, 0.02);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 13px;
  color: var(--text);
  background: var(--bg-void);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(245, 165, 36, 0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(34, 211, 238, 0.03) 0%, transparent 50%),
    linear-gradient(var(--scanline) 50%, transparent 50%);
  background-size: 100% 100%, 100% 100%, 100% 4px;
}

#root { height: 100vh; display: flex; flex-direction: column; }

.display-font { font-family: 'Michroma', sans-serif; letter-spacing: 0.05em; }
.serif-font { font-family: 'Cormorant Garamond', serif; }

.glow-amber { text-shadow: 0 0 8px var(--amber-glow), 0 0 2px rgba(245, 165, 36, 0.5); }
.glow-red { text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }

.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  position: relative;
}

.panel-header {
  background: linear-gradient(180deg, var(--bg-raised) 0%, var(--bg-panel) 100%);
  border-bottom: 1px solid var(--border);
  padding: 6px 12px;
  font-family: 'Michroma', sans-serif;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--amber);
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
}

.panel-header::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: var(--amber);
  margin-right: 8px;
  box-shadow: 0 0 6px var(--amber);
}

.corner-tl::before, .corner-tr::before, .corner-bl::before, .corner-br::before {
  content: ''; position: absolute; width: 8px; height: 8px;
  border-color: var(--amber); pointer-events: none;
}
.corner-tl::before { top: -1px; left: -1px; border-top: 2px solid; border-left: 2px solid; }

button, .btn {
  background: var(--bg-raised);
  border: 1px solid var(--border-bright);
  color: var(--text);
  padding: 6px 14px;
  font-family: inherit;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  transition: all 0.15s;
  position: relative;
}

button:hover, .btn:hover {
  background: var(--bg-inset);
  border-color: var(--amber);
  color: var(--amber);
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

input.no-spin::-webkit-outer-spin-button,
input.no-spin::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input.no-spin {
  -moz-appearance: textfield;
  appearance: textfield;
}

button.primary {
  border-color: var(--amber);
  color: var(--amber);
}
button.primary:hover {
  background: var(--amber);
  color: var(--bg-void);
}

button.danger {
  border-color: var(--red);
  color: var(--red);
}

input, textarea, select {
  background: var(--bg-inset);
  border: 1px solid var(--border);
  color: var(--text-bright);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 10px;
  width: 100%;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--amber);
  box-shadow: 0 0 0 1px var(--amber-glow);
}

.bar-track {
  background: var(--bg-inset);
  height: 4px;
  width: 100%;
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}

.bar-fill { height: 100%; transition: width 0.3s; }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px 16px;
  font-size: 11px;
}

.stat-label { color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }
.stat-value { color: var(--text-bright); text-align: right; }

.scroll { overflow-y: auto; }
.scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.scroll::-webkit-scrollbar-track { background: var(--bg-inset); }
.scroll::-webkit-scrollbar-thumb { background: var(--border-bright); }
.scroll::-webkit-scrollbar-thumb:hover { background: var(--amber-dim); }

@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.6); }
  50% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.9); }
}

.pulse-red { animation: pulse-red 1.8s infinite; }

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}
.blink { animation: blink 1.2s infinite; }

.region-path {
  fill: var(--bg-raised);
  stroke: var(--border-bright);
  stroke-width: 0.8;
  transition: all 0.2s;
  cursor: pointer;
}
.region-panic-crisis { animation: pulse-red 2s infinite; }

.ufo-icon {
  fill: var(--magenta);
  stroke: #fff;
  stroke-width: 0.5;
  filter: drop-shadow(0 0 3px var(--magenta));
}

.log-entry {
  padding: 4px 8px;
  border-left: 2px solid var(--border);
  font-size: 11px;
  line-height: 1.5;
}
.log-entry.alien { border-color: var(--magenta); }
.log-entry.combat { border-color: var(--red); }
.log-entry.research { border-color: var(--cyan); }
.log-entry.system { border-color: var(--amber); }

.tab-btn {
  flex: 1;
  padding: 8px 4px;
  font-size: 10px;
  letter-spacing: 0.1em;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-dim);
}
.tab-btn.active {
  color: var(--amber);
  border-bottom-color: var(--amber);
}
.tab-btn:hover { color: var(--text); background: transparent; border-bottom-color: var(--border-bright); }

.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

.modal {
  background: var(--bg-panel);
  border: 1px solid var(--amber);
  box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 20px var(--amber-glow);
  max-width: 700px;
  max-height: 85vh;
  width: 100%;
  display: flex;
  flex-direction: column;
}

.chat-line {
  padding: 8px 14px;
  border-left: 2px solid var(--border);
  margin-bottom: 10px;
  line-height: 1.6;
}
.chat-line.player {
  border-left-color: var(--cyan);
  color: var(--cyan);
  background: rgba(34, 211, 238, 0.03);
}
.chat-line.director {
  border-left-color: var(--amber);
  color: var(--text);
  background: rgba(245, 165, 36, 0.03);
}
.chat-line.system {
  border-left-color: var(--text-dim);
  color: var(--text-dim);
  font-size: 11px;
  font-style: italic;
}
.chat-line.battle {
  border-left-color: var(--red);
  background: rgba(239, 68, 68, 0.04);
}

.choice-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 8px 12px;
  margin-top: 6px;
  font-size: 12px;
  color: rgba(34, 211, 238, 0.55);
  border-color: rgba(34, 211, 238, 0.35);
  background: rgba(34, 211, 238, 0.025);
  text-transform: none;
  letter-spacing: normal;
  opacity: 0.75;
  transition: opacity 0.15s, color 0.15s, background 0.15s;
}
.choice-btn:hover {
  opacity: 1;
  background: var(--cyan);
  color: var(--bg-void);
  border-color: var(--cyan);
}

.dlg-speaker {
  font-family: 'Michroma', sans-serif;
  font-size: 10px;
  color: var(--amber);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}

.hex-sep { color: var(--border-bright); margin: 0 8px; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--border-bright);
  color: var(--text-dim);
  margin-right: 4px;
  margin-bottom: 2px;
}
.tag.amber { border-color: var(--amber); color: var(--amber); }
.tag.red { border-color: var(--red); color: var(--red); }
.tag.green { border-color: var(--green); color: var(--green); }
.tag.cyan { border-color: var(--cyan); color: var(--cyan); }

.roster-row {
  padding: 4px 8px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.roster-row:hover {
  background: var(--bg-raised);
}

.console-prompt::before {
  content: '>';
  color: var(--amber);
  margin-right: 6px;
  font-weight: bold;
}
</style>
</head>
<body>
<div id="root"></div>

</body>
</html>
